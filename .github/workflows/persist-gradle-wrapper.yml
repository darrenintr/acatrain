name: Persist Gradle wrapper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Generate Gradle wrapper from matching Flutter template
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          flutter create --empty --no-pub --org io.github.darrenintr --project-name acatrain --platforms=android "$tmp/acatrain"
          cp "$tmp/acatrain/android/gradlew" android/gradlew
          cp "$tmp/acatrain/android/gradlew.bat" android/gradlew.bat
          cp "$tmp/acatrain/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew
          rm -rf "$tmp"
      - name: Commit Gradle wrapper
        run: |
          set -euo pipefail
          git add android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            echo "Gradle wrapper is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(android): persist Gradle wrapper"
          git push origin HEAD:main
