name: Deploy Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_seed:
        description: Replace existing live content with assets/seed.json (empty installations are initialized automatically)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: acatrain-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Firebase + Cloudflare
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
      ACATRAIN_API_URL: ${{ vars.ACATRAIN_API_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EXTRA_ALLOWED_ORIGINS: ${{ vars.EXTRA_ALLOWED_ORIGINS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Resolve Worker API URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          if printf '%s' "${ACATRAIN_API_URL:-}" | grep -Eq '^https://'; then
            echo "Using configured ACATRAIN_API_URL: $ACATRAIN_API_URL"
            exit 0
          fi
          response="$(curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          subdomain="$(CF_RESPONSE="$response" node -e '
            const data = JSON.parse(process.env.CF_RESPONSE);
            if (!data.success || !data.result?.subdomain) process.exit(1);
            process.stdout.write(data.result.subdomain);
          ')"
          if [ -z "$subdomain" ]; then
            echo "::error::No workers.dev subdomain is configured for this Cloudflare account."
            exit 1
          fi
          resolved="https://acatrain-api.$subdomain.workers.dev"
          echo "ACATRAIN_API_URL=$resolved" >> "$GITHUB_ENV"
          echo "Resolved Worker URL: $resolved"

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          MCP_EDIT_TOKEN: ${{ secrets.MCP_EDIT_TOKEN }}
          MCP_PUBLISH_TOKEN: ${{ secrets.MCP_PUBLISH_TOKEN }}
        run: |
          set -eu
          require() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub Actions configuration: $name"
              exit 1
            fi
          }
          require FIREBASE_PROJECT_ID "$FIREBASE_PROJECT_ID"
          require FIREBASE_WEB_API_KEY "$FIREBASE_WEB_API_KEY"
          require CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          require CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          require FIREBASE_SERVICE_ACCOUNT "$FIREBASE_SERVICE_ACCOUNT"
          require FIREBASE_DEPLOY_SERVICE_ACCOUNT "$FIREBASE_DEPLOY_SERVICE_ACCOUNT"
          require MCP_EDIT_TOKEN "$MCP_EDIT_TOKEN"
          require MCP_PUBLISH_TOKEN "$MCP_PUBLISH_TOKEN"

          node <<'NODE'
          function parse(name) {
            let value = process.env[name];
            try {
              let data = JSON.parse(value);
              if (typeof data === 'string') data = JSON.parse(data);
              if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('not an object');
              return data;
            } catch {
              console.error(`::error::${name} must contain the complete service-account JSON document`);
              process.exit(1);
            }
          }
          const runtime = parse('FIREBASE_SERVICE_ACCOUNT');
          const deploy = parse('FIREBASE_DEPLOY_SERVICE_ACCOUNT');
          if (runtime.project_id !== process.env.FIREBASE_PROJECT_ID) {
            console.error('::error::FIREBASE_SERVICE_ACCOUNT project_id does not match FIREBASE_PROJECT_ID');
            process.exit(1);
          }
          if (deploy.project_id !== process.env.FIREBASE_PROJECT_ID) {
            console.error('::error::FIREBASE_DEPLOY_SERVICE_ACCOUNT project_id does not match FIREBASE_PROJECT_ID');
            process.exit(1);
          }
          if (!runtime.client_email || !runtime.private_key?.includes('PRIVATE KEY')) {
            console.error('::error::FIREBASE_SERVICE_ACCOUNT is missing client_email or private_key');
            process.exit(1);
          }
          if (!deploy.client_email || !deploy.private_key?.includes('PRIVATE KEY')) {
            console.error('::error::FIREBASE_DEPLOY_SERVICE_ACCOUNT is missing client_email or private_key');
            process.exit(1);
          }
          NODE

          case "$ACATRAIN_API_URL" in
            https://*) ;;
            *) echo "::error::ACATRAIN_API_URL must use https://"; exit 1 ;;
          esac
          if [ ${#MCP_EDIT_TOKEN} -lt 32 ] || [ ${#MCP_PUBLISH_TOKEN} -lt 32 ]; then
            echo "::error::MCP tokens must each be at least 32 characters."
            exit 1
          fi
          if [ "$MCP_EDIT_TOKEN" = "$MCP_PUBLISH_TOKEN" ]; then
            echo "::error::MCP_EDIT_TOKEN and MCP_PUBLISH_TOKEN must be different."
            exit 1
          fi

      - name: Test content backend
        run: |
          npm test --prefix backend/worker
          node tool/check-content.mjs

      - name: Prepare Flutter web
        run: |
          node tool/bootstrap.mjs --platforms=web
          flutter pub get
          flutter build web --release \
            --dart-define=ACATRAIN_API_URL="$ACATRAIN_API_URL" \
            --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY"

      - name: Deploy Cloudflare Worker with secrets
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MCP_EDIT_TOKEN: ${{ secrets.MCP_EDIT_TOKEN }}
          MCP_PUBLISH_TOKEN: ${{ secrets.MCP_PUBLISH_TOKEN }}
        run: |
          set -eu
          secrets_file="$RUNNER_TEMP/acatrain-worker-secrets.json"
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/acatrain-worker-secrets.json', JSON.stringify({
            FIREBASE_SERVICE_ACCOUNT: process.env.FIREBASE_SERVICE_ACCOUNT,
            MCP_EDIT_TOKEN: process.env.MCP_EDIT_TOKEN,
            MCP_PUBLISH_TOKEN: process.env.MCP_PUBLISH_TOKEN
          }));
          NODE
          trap 'rm -f "$secrets_file"' EXIT

          allowed="http://localhost:8080,https://${FIREBASE_PROJECT_ID}.web.app,https://${FIREBASE_PROJECT_ID}.firebaseapp.com"
          if [ -n "${EXTRA_ALLOWED_ORIGINS:-}" ]; then
            allowed="$allowed,$EXTRA_ALLOWED_ORIGINS"
          fi

          npx wrangler@4 deploy \
            --secrets-file "$secrets_file" \
            --var "FIREBASE_PROJECT_ID:$FIREBASE_PROJECT_ID" \
            --var "FIREBASE_WEB_API_KEY:$FIREBASE_WEB_API_KEY" \
            --var "ALLOWED_ORIGINS:$allowed"

      - name: Verify Worker
        id: verify_worker
        run: |
          set -eu
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "$ACATRAIN_API_URL/health" > "$RUNNER_TEMP/acatrain-health.json"
          cat "$RUNNER_TEMP/acatrain-health.json"
          node -e "const h=require(process.env.RUNNER_TEMP+'/acatrain-health.json'); if(!h.ok || !h.configured) process.exit(1)"
          node tool/verify-deployment.mjs --allow-empty > "$RUNNER_TEMP/acatrain-content.json"
          cat "$RUNNER_TEMP/acatrain-content.json"
          node -e "const c=require(process.env.RUNNER_TEMP+'/acatrain-content.json'); console.log('empty='+c.empty)" >> "$GITHUB_OUTPUT"

      - name: Publish bundled seed content
        if: ${{ inputs.publish_seed || steps.verify_worker.outputs.empty == 'true' }}
        env:
          MCP_PUBLISH_TOKEN: ${{ secrets.MCP_PUBLISH_TOKEN }}
        run: node tool/publish.mjs --publish assets/seed.json

      - name: Verify published content
        run: node tool/verify-deployment.mjs

      - name: Authenticate Firebase deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules, indexes and Firebase Hosting
        run: |
          npx firebase-tools@latest deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only firestore:rules,firestore:indexes,hosting \
            --non-interactive

      - name: Deployment summary
        run: |
          {
            echo "## Acatrain production deployment"
            echo
            echo "- Worker: $ACATRAIN_API_URL"
            echo "- Web: https://$FIREBASE_PROJECT_ID.web.app"
            echo "- Firestore rules/indexes: deployed"
            if [ "${{ inputs.publish_seed || steps.verify_worker.outputs.empty == 'true' }}" = "true" ]; then
              echo "- Bundled seed content: published"
            else
              echo "- Bundled seed content: not published"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
