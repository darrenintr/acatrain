name: Persist native runners

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Generate Android and iOS runners
        run: node tool/bootstrap.mjs --platforms=android,ios
      - name: Commit generated runners
        run: |
          set -euo pipefail
          test -d android
          test -d ios
          git add android ios
          if git diff --cached --quiet; then
            echo "Android and iOS runners are already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist Android and iOS runners"
          git push origin HEAD:main
