name: acatrain
description: Offline-first study sets with safe, versioned MCP content updates.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  http: ^1.4.0
  flutter_displaymode: ^0.7.0
  google_sign_in: ^7.2.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed.json
  fonts:
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
