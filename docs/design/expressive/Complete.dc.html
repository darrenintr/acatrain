<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
countTo(delay, ms) {
const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) { this.setState({ k: 1 }); return; }
if (this._raf) cancelAnimationFrame(this._raf);
const t0 = performance.now();
const tick = (t) => {
const p = Math.min(1, Math.max(0, (t - t0 - delay) / ms));
const e = 1 - Math.pow(1 - p, 4);
this.setState({ k: e });
if (p < 1) this._raf = requestAnimationFrame(tick);
};
this.setState({ k: 0 });
this._raf = requestAnimationFrame(tick);
}
componentWillUnmount() { if (this._raf) cancelAnimationFrame(this._raf); clearTimeout(this._t1); clearTimeout(this._t2); }
componentDidMount() { this.countTo(300, 700); this._t1 = setTimeout(() => this.hap('celebrate'), 1000); this._t2 = setTimeout(() => this.hap('streak'), 1500); }
replayNow() {
this.setState({ gen: ((this.state && this.state.gen) || 0) + 1 });
this.countTo(300, 700);
clearTimeout(this._t1); this._t1 = setTimeout(() => this.hap('celebrate'), 1000);
}
vals() {
const k = (this.state && this.state.k != null) ? this.state.k : 1;
const gen = (this.state && this.state.gen) || 0;
return {
score: Math.round(6 * k), got: Math.round(6 * k), practised: Math.round(4 * k),
burstA: gen % 2 === 0, burstB: gen % 2 === 1,
replay: () => this.replayNow(),
};
}
hap(name) {
const P = {"tick": [6], "tap": [10], "flip": [6, 214, 8], "confirm": [14, 56, 10], "again": [18], "reject": [20, 39, 12, 55, 8, 59, 5], "celebrate": [40, 260, 20, 60, 8, 72, 6, 74, 5], "streak": [8, 100, 12], "toggle": [8], "done": [10, 60, 8], "error": [24, 86, 24], "threshold": [12]};
let lvl = 2;
try { const v = window.localStorage.getItem('acHaptics'); if (v !== null) lvl = Number(v); } catch (e) {}
if (lvl > 0 && typeof navigator !== 'undefined' && navigator.vibrate) {
const p = (P[name] || [10]).map((d, i) => (i % 2 ? d : Math.max(1, Math.round(d * (lvl === 1 ? 0.6 : 1)))));
try { navigator.vibrate(p); } catch (e) {}
}
const g = ((this.state && this.state.hg) || 0) + 1;
this.setState({ hg: g, hn: lvl > 0 ? name + (lvl === 1 ? ' · subtle' : '') : name + ' · off' });
}
hapVals() {
const s = this.state || {};
const g = s.hg || 0;
return { hudA: g > 0 && g % 2 === 1, hudB: g > 0 && g % 2 === 0, hudLabel: s.hn || '',
tap: () => this.hap('tap'), navTick: () => this.hap('tick') };
}
renderVals() { return Object.assign({}, this.vals(), this.hapVals()); }

}
